<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calibrador de Acelerómetro Industrial</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #222; color: #fff; }
        .eje { font-size: 24px; margin: 10px 0; font-family: monospace; }
        .consola { background: #000; border: 1px solid #444; height: 200px; overflow-y: scroll; padding: 10px; font-size: 14px; color: #0f0; }
        button { padding: 15px; font-size: 16px; background: #007bff; color: white; border: none; border-radius: 5px; width: 100%; margin-bottom: 20px;}
    </style>
</head>
<body>

    <h2>Calibración de Movimiento</h2>
    <p>Usa esta pantalla en el celular reciclado para analizar los impactos físicos con guantes.</p>
    
    <!-- Algunos navegadores exigen un clic del usuario antes de activar sensores -->
    <button onclick="solicitarPermisos()">Activar Sensores</button>

    <div class="eje">Eje X (Lateral): <span id="valX">0</span></div>
    <div class="eje">Eje Y (Longitudinal): <span id="valY">0</span></div>
    <div class="eje">Eje Z (Vertical/Golpe): <span id="valZ">0</span></div>

    <h3>Registro de Eventos Detectados:</h3>
    <div id="consolaLog" class="consola"></div>

    <script>
        const logPanel = document.getElementById('consolaLog');
        
        function log(texto) {
            logPanel.innerHTML += `[${new Date().toLocaleTimeString()}] ${texto}<br>`;
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function solicitarPermisos() {
            if (typeof DeviceMotionEvent.requestPermission === 'function') {
                // Caso específico para iOS modernos (por si acaso)
                DeviceMotionEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            conectarAcelerometro();
                        } else {
                            log("Permiso denegado por el usuario.");
                        }
                    });
            } else {
                // Caso estándar para la mayoría de dispositivos Android viejos
                conectarAcelerometro();
            }
        }

        function conectarAcelerometro() {
            if (window.DeviceMotionEvent) {
                window.addEventListener('devicemotion', procesarMovimiento, false);
                log("Acelerómetro conectado exitosamente.");
            } else {
                log("ERROR: Este celular reciclado no soporta DeviceMotionEvent.");
            }
        }

        function procesarMovimiento(event) {
            // Usamos la aceleración con gravedad porque en celulares viejos es más cruda y reactiva
            const acc = event.accelerationIncludingGravity;
            if (!acc) return;

            // Mostrar valores en tiempo real (redondeados para legibilidad)
            document.getElementById('valX').innerText = acc.x.toFixed(2);
            document.getElementById('valY').innerText = acc.y.toFixed(2);
            document.getElementById('valZ').innerText = acc.z.toFixed(2);

            // --- LÓGICA DE FILTRADO PARA DISCUSIÓN ---
            
            // Umbral estricto para el golpe en Z (ignora gravedad base de 9.8)
            // Si el teléfono está en la mesa (Z ≈ 9.8) y le pegan, el valor se dispara o cae bruscamente.
            const fuerzaZpura = Math.abs(acc.z - 9.8); 

            if (fuerzaZpura > 12) { 
                log(`¡GOLPE EN Z DETECTADO! Fuerza pura: ${fuerzaZpura.toFixed(2)}`);
                // Aquí verificaríamos si X e Y se mantuvieron relativamente bajos 
                // para asegurar que el teléfono NO se levantó ni se giró.
                if (Math.abs(acc.x) < 5 && Math.abs(acc.y) < 5) {
                    log("👉 CONFIRMADO: Esto fue un golpe seco en la mesa (X e Y estables).");
                }
            }

            // Detectar si el teléfono está siendo levantado o inclinado bruscamente en Y
            if (Math.abs(acc.y) > 8) {
                log(`⚠️ MOVIMIENTO EN Y: El teléfono se inclinó hacia adelante/atrás.`);
            }
            
            // Detectar si el teléfono se movió de lado
            if (Math.abs(acc.x) > 8) {
                log(`⚠️ MOVIMIENTO EN X: El teléfono se desplazó lateralmente.`);
            }
        }
    </script>
</body>
</html>
