<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OCR Nativo - Franja Fina + Zoom</title>
  <style>
    body { font-family: sans-serif; margin: 0; background: #111; color: #fff; text-align: center; }
    .visor { position: relative; width: 100%; max-width: 640px; margin: auto; background: #000; overflow: hidden; }
    video { width: 100%; display: block; }
    
    /* Ventana más baja (14% de alto) y centrada para una sola línea */
    .encuadre {
      position: absolute; top: 43%; left: 8%; width: 84%; height: 14%;
      border: 3px solid #00ff88; border-radius: 6px; box-sizing: border-box;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.65); pointer-events: none;
    }
    .panel { padding: 12px; }
    #estado { color: #aaa; font-size: 0.9rem; margin-bottom: 8px; }
    #resultado {
      font-size: 1.4rem; font-weight: bold; color: #00ff88;
      background: #222; padding: 12px; border-radius: 6px; min-height: 28px;
    }
    .botones { display: flex; gap: 10px; max-width: 450px; margin: 10px auto 0; }
    button {
      flex: 1; padding: 16px 10px; font-size: 1rem; font-weight: bold;
      background: #0066cc; color: #fff; border: none; border-radius: 8px;
    }
    #btn-luz { background: #444; flex: 0.45; }
    #btn-luz.activa { background: #d97706; }
    #canvas { display: none; }
  </style>
</head>
<body>

  <div class="visor">
    <video id="video" autoplay playsinline></video>
    <div class="encuadre"></div>
  </div>

  <div class="panel">
    <div id="estado">Toca "Escanear" o golpea el equipo</div>
    <div id="resultado">---</div>
    <div class="botones">
      <button id="btn-accion">Activar / Escanear</button>
      <button id="btn-luz">Luz: OFF</button>
    </div>
    <canvas id="canvas"></canvas>
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const estado = document.getElementById('estado');
    const resultado = document.getElementById('resultado');
    const btn = document.getElementById('btn-accion');
    const btnLuz = document.getElementById('btn-luz');

    let detector = null;
    let trackCamara = null;
    let escaneando = false;
    let luzActiva = false;
    let ultimoGolpe = 0;

    // Filtro exacto: empieza con #20000 y sigue con 10 números
    const FILTRO_REGEX = /^#20000[0-9]{11}$/;

    async function iniciarSistema() {
      if (!('TextDetector' in window)) {
        estado.innerText = "ERROR: Activa 'Experimental Web Platform features' en chrome://flags";
        return;
      }

      try {
        detector = window.TextDetector.create 
          ? await TextDetector.create() 
          : new TextDetector();

        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: 'environment',
            width: { ideal: 1920 }, // Mayor resolución para letras chicas
            height: { ideal: 1080 }
          }
        });

        video.srcObject = stream;
        trackCamara = stream.getVideoTracks()[0];

        // Aplicar Zoom 2x y enfoque continuo si el lente lo soporta
        const caps = trackCamara.getCapabilities();
        const ajustes = { advanced: [] };

        if (caps.zoom) {
          const nivelZoom = Math.min(2.2, caps.zoom.max); // 2.2x para leer sin acercarse
          ajustes.advanced.push({ zoom: nivelZoom });
        }
        if (caps.focusMode && caps.focusMode.includes('continuous')) {
          ajustes.advanced.push({ focusMode: 'continuous' });
        }

        if (ajustes.advanced.length > 0) {
          await trackCamara.applyConstraints(ajustes);
        }

        video.onloadedmetadata = () => {
          activarModoEscaneo(true);
        };
      } catch (err) {
        estado.innerText = "Error de cámara: " + err.message;
      }
    }

    function activarModoEscaneo(activar) {
      escaneando = activar;
      estado.innerText = activar ? "Buscando #20000... (mantén distancia de 20-30 cm)" : "Pausado (golpea o toca para leer)";
      if (activar) bucleOCR();
    }

    async function bucleOCR() {
      if (!escaneando) return;

      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        const vw = video.videoWidth;
        const vh = video.videoHeight;

        // Recorte fino exacto del recuadro verde (top: 43%, left: 8%, width: 84%, height: 14%)
        canvas.width = 640;
        canvas.height = 140;

        ctx.drawImage(
          video,
          vw * 0.08, vh * 0.43, vw * 0.84, vh * 0.14,
          0, 0, canvas.width, canvas.height
        );

        try {
          const bloques = await detector.detect(canvas);

          for (const bloque of bloques) {
            // Limpiar espacios y errores típicos de OCR (ej. letra 'O' por cero '0' tras el #)
            let limpio = bloque.rawValue.trim().toUpperCase().replace(/\s+/g, '');
            
            if (FILTRO_REGEX.test(limpio)) {
              resultado.innerText = limpio;
              if (navigator.vibrate) navigator.vibrate(100);
              activarModoEscaneo(false);
              return;
            }
          }
        } catch (e) {
          estado.innerText = "Error OCR: " + e.message;
        }
      }

      setTimeout(bucleOCR, 300);
    }

    // Botón principal
    btn.addEventListener('click', () => {
      if (!trackCamara) iniciarSistema();
      else activarModoEscaneo(!escaneando);
    });

    // Botón manual de linterna (apagada por defecto)
    btnLuz.addEventListener('click', async () => {
      if (!trackCamara) return;
      const caps = trackCamara.getCapabilities();
      if (!caps.torch) {
        estado.innerText = "Este equipo no permite controlar la luz desde el navegador";
        return;
      }
      luzActiva = !luzActiva;
      await trackCamara.applyConstraints({ advanced: [{ torch: luzActiva }] });
      btnLuz.innerText = luzActiva ? "Luz: ON" : "Luz: OFF";
      btnLuz.classList.toggle('activa', luzActiva);
    });

    // Activación por golpe seco
    window.addEventListener('devicemotion', (e) => {
      const acc = e.accelerationIncludingGravity;
      if (!acc) return;
      const fuerza = Math.sqrt(acc.x * acc.x + acc.y * acc.y + acc.z * acc.z);
      if (fuerza > 22 && Date.now() - ultimoGolpe > 1500) {
        ultimoGolpe = Date.now();
        if (trackCamara && !escaneando) activarModoEscaneo(true);
      }
    });
  </script>
</body>
</html>
