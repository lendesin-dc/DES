<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prueba Botón Volumen -> Tap Pantalla</title>
  <style>
    body {
      margin: 0; font-family: sans-serif; background: #111; color: #fff;
      display: flex; flex-direction: column; height: 100vh; text-align: center;
    }
    .info {
      flex: 1; display: flex; flex-direction: column;
      justify-content: center; align-items: center; padding: 20px;
    }
    #contador { font-size: 4rem; font-weight: bold; color: #00ff88; margin: 10px 0; }
    #estado { font-size: 1.3rem; color: #ccc; }
    
    /* Botón gigante que ocupa toda la mitad inferior */
    #btn-disparo {
      height: 50vh; width: 100%; border: none;
      background: #0066cc; color: #fff; font-size: 1.8rem; font-weight: bold;
      cursor: pointer; touch-action: manipulation;
    }
    #btn-disparo.activo { background: #e67e22; }
  </style>
</head>
<body>

  <div class="info">
    <div id="estado">EN ESPERA</div>
    <div id="contador">0</div>
    <div>Pulsaciones recibidas</div>
  </div>

  <button id="btn-disparo">DISPARADOR</button>

  <script>
    const btn = document.getElementById('btn-disparo');
    const contador = document.getElementById('contador');
    const estado = document.getElementById('estado');
    let cuenta = 0;
    let encendido = false;

    btn.addEventListener('click', () => {
      cuenta++;
      encendido = !encendido;

      contador.innerText = cuenta;
      estado.innerText = encendido ? "ACTIVADO (Naranja)" : "EN ESPERA (Azul)";
      btn.classList.toggle('activo', encendido);

      if (navigator.vibrate) navigator.vibrate(80);
    });
  </script>
</body>
</html>
